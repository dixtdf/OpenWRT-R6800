name: Build OpenWrt R6800

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "files/**"
      - "scripts/**"
      - "patches/**"
      - "tests/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: r6800-build-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENWRT_VERSION: v25.12.6
  EASYTIER_LUCI_COMMIT: 9c51d3f8d2bfcefd039f2ff2354c6a7674293a06
  VANTAGE_COMMIT: faade36bb629f84b1e233edcad9e37abc500ae52

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib gawk gettext git \
            libncurses-dev libssl-dev zlib1g-dev python3 python3-pyelftools \
            device-tree-compiler flex bison patch perl wget curl unzip rsync \
            xsltproc file time ca-certificates ccache

      - name: Run patch and layout tests
        run: |
          python3 tests/test_layout.py
          python3 tests/test_easytier_patch.py
          python3 tests/test_scpart_patch.py
          python3 tests/test_perf_config.py

      - name: Check out OpenWrt, EasyTier and the Vantage theme
        run: |
          git clone --depth 1 --branch "$OPENWRT_VERSION" https://github.com/openwrt/openwrt.git openwrt
          git clone https://github.com/EasyTier/luci-app-easytier.git openwrt/package/easytier-luci
          git -C openwrt/package/easytier-luci checkout "$EASYTIER_LUCI_COMMIT"
          git -C openwrt/package/easytier-luci apply "$GITHUB_WORKSPACE/patches/easytier/0001-verify-mipsel-core-sha256.patch"
          git clone https://github.com/anothaDev/luci-theme-vantage.git /tmp/vantage
          git -C /tmp/vantage checkout "$VANTAGE_COMMIT"
          cp -a /tmp/vantage/luci-theme-vantage /tmp/vantage/luci-app-vantage openwrt/package/
          rm -rf /tmp/vantage
          # 25.12 moved the CCACHE switch to the SDK Kconfig; expose it in the
          # firmware build so CONFIG_CCACHE=y is honoured (rules.mk wraps CC).
          if ! grep -q 'config CCACHE' openwrt/Config.in; then
            printf '\nconfig CCACHE\n\tbool "Use ccache"\n\nconfig CCACHE_DIR\n\tstring "Set ccache directory"\n\tdepends on CCACHE\n' >> openwrt/Config.in
          fi

      - name: Prepare ccache
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/openwrt/.ccache" >> "$GITHUB_ENV"
          ccache --version | head -1

      - name: Cache downloads (shared across versions, like docker layers)
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-mt7621
          restore-keys: |
            openwrt-dl-mt7621
            openwrt-dl-

      - name: Cache cross toolchain
        uses: actions/cache@v4
        with:
          path: openwrt/staging_dir/toolchain-mipsel_24kc_*_musl
          key: openwrt-${{ env.OPENWRT_VERSION }}-tc-v3-mt7621
          restore-keys: |
            openwrt-${{ env.OPENWRT_VERSION }}-tc-
            openwrt-tc-

      - name: Cache ccache (content-addressed compiler cache)
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: openwrt-${{ env.OPENWRT_VERSION }}-ccache-mt7621
          restore-keys: |
            openwrt-${{ env.OPENWRT_VERSION }}-ccache-

      - name: Apply and verify the 64 MiB R6800 layout
        run: |
          python3 scripts/apply-r6800-64mib.py openwrt
          python3 scripts/apply-r6800-performance.py openwrt
          python3 scripts/validate-r6800.py openwrt --skip-config
          git -C openwrt diff --check

      - name: Install device overlay files
        run: |
          mkdir -p openwrt/files
          cp -a "$GITHUB_WORKSPACE/files/." openwrt/files/
          chmod +x openwrt/files/etc/uci-defaults/* openwrt/files/usr/sbin/* 2>/dev/null || true

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/config/r6800.config" .config
          make defconfig
          cd "$GITHUB_WORKSPACE"
          python3 scripts/validate-r6800.py openwrt
          cp openwrt/.config openwrt/config.buildinfo

      - name: Download sources
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) download V=s 2>&1 | tee "$GITHUB_WORKSPACE/download.log"

      - name: Build firmware
        id: compile
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Validate images and final DTB
        run: |
          set -o pipefail
          python3 scripts/validate-r6800.py openwrt --artifacts 2>&1 | tee "$GITHUB_WORKSPACE/validation.log"
          ls -lh openwrt/bin/targets/ramips/mt7621/

      - name: Verify performance options in the built kernel
        run: |
          KCONFIG="$(find openwrt/build_dir -path '*linux-ramips_mt7621*' -name .config | head -n1)"
          echo "kernel config: $KCONFIG"
          test -n "$KCONFIG"
          grep -E '^CONFIG_TCP_CONG_BBR=y$' "$KCONFIG"
          grep -E '^CONFIG_DEFAULT_BBR=y$' "$KCONFIG"
          grep -E '^# CONFIG_DEFAULT_CUBIC is not set$' "$KCONFIG"
          grep -E '^CONFIG_NET_MEDIATEK_SOC=y$' "$KCONFIG"

      - name: Verify the extra LuCI packages
        run: |
          grep -E '^(CONFIG_PACKAGE_(luci-theme-vantage|luci-app-vantage|luci-i18n-vantage-zh-cn|luci-i18n-vantage-theme-zh-cn|ttyd|luci-app-ttyd|luci-i18n-ttyd-zh-cn|htop|nano|mtr-nojson|socat|screen|luci-app-watchcat|luci-app-commands)=y)$' openwrt/config.buildinfo
          grep -E 'vantage|ttyd|htop|nano|mtr|socat|screen|watchcat|commands' openwrt/bin/targets/ramips/mt7621/openwrt-ramips-mt7621-netgear_r6800.manifest

      - name: Upload firmware
        if: ${{ success() || steps.compile.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-R6800-64MiB-${{ github.run_number }}
          path: |
            openwrt/bin/targets/ramips/mt7621/*.bin
            openwrt/bin/targets/ramips/mt7621/*.img
            openwrt/bin/targets/ramips/mt7621/*.manifest
            openwrt/bin/targets/ramips/mt7621/*.buildinfo
            openwrt/bin/targets/ramips/mt7621/profiles.json
            openwrt/bin/targets/ramips/mt7621/sha256sums
            openwrt/config.buildinfo
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-R6800-build-logs-${{ github.run_number }}
          path: |
            build.log
            download.log
            validation.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish firmware images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch image artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenWrt-R6800-64MiB-${{ github.run_number }}
          path: images
      - name: Get build time
        id: build_time
        run: |
          echo "ts=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "name=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish release (one new release per build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.OPENWRT_VERSION }}-${{ steps.build_time.outputs.ts }}
          name: OpenWrt ${{ env.OPENWRT_VERSION }} · ${{ steps.build_time.outputs.name }}
          body: |
            ## R6800 OpenWrt 64MiB 固件

            - 构建时间：${{ steps.build_time.outputs.name }}
            - 基础：OpenWrt ${{ env.OPENWRT_VERSION }}（ramips/mt7621）

            ### 额外集成内容（中文标记）

            **主题与界面**
            - **Vantage 主题**（默认主题）＋ **Vantage 仪表盘**
            - 中文语言包：luci-i18n-vantage-zh-cn、luci-i18n-vantage-theme-zh-cn

            **终端**
            - **ttyd** Web 终端服务 ＋ **LuCI 终端界面**（luci-app-ttyd）
            - 中文语言包：luci-i18n-ttyd-zh-cn

            **常用工具**
            - htop、nano、mtr、socat、screen

            **网络与运维**
            - **看门狗**：luci-app-watchcat（断网自动重启/切换）
            - **快捷命令**：luci-app-commands（LuCI 自定义命令按钮）

            **其它中文界面**
            - luci-i18n-base-zh-cn、luci-i18n-firewall-zh-cn、
              luci-i18n-package-manager-zh-cn、luci-i18n-ddns-zh-cn、
              luci-i18n-sqm-zh-cn、luci-i18n-easytier-zh-cn

            **网络与性能**
            - DDNS、SQM、USB 存储、iperf3、ethtool、BBR 内核、flow offloading
          files: |
            images/**/*.bin
            images/**/*.img
