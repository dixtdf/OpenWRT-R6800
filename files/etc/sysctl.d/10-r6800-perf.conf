# R6800 performance tuning (applied on every boot)
#
# These are deliberately moderate: the MT7621 has 256 MiB RAM and the
# bottleneck for router-terminated traffic is the single RX queue in
# mtk_eth_soc, not socket buffers.  Values were measured on hardware and
# keep memory usage bounded while removing the default softirq limits.

# Process more packets per NAPI poll before yielding.
net.core.netdev_budget = 1000
net.core.netdev_budget_usecs = 8000
net.core.dev_weight = 128
net.core.netdev_max_backlog = 2000

# Allow larger TCP windows for high-BDP / Wi-Fi paths (4 MiB ceiling).
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_rmem = 4096 131072 4194304
net.ipv4.tcp_wmem = 4096 65536 4194304

# Keep cwnd after idle, probe PMTU black holes, allow TFO.
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3

# BBR is built into this kernel (CONFIG_TCP_CONG_BBR=y).  It is far less
# sensitive to the random loss seen on 2.4 GHz than cubic.
net.ipv4.tcp_congestion_control = bbr
